# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Without the mkdocs: key, RTD does not install requirements automatically.
    install:
      - python -m pip install -r docs/requirements.txt
    # $READTHEDOCS_LANGUAGE will be en or ja.
    build:
      html:
        - python -m mkdocs build --clean --config-file mkdocs.$READTHEDOCS_LANGUAGE.yml --site-dir $READTHEDOCS_OUTPUT/html
